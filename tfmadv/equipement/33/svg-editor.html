<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>HSV Smart SVG Editor</title>
<style>
* { box-sizing: border-box; }
body { background:#1e1e1e; color:white; font-family:'Segoe UI',sans-serif; margin:0; padding:20px; }
h2 { text-align:center; margin-bottom:20px; }

.container { display:flex; gap:20px; max-width:1400px; margin:0 auto; }
.svg-panel { flex:1; background:#2a2a2a; padding:20px; border-radius:10px; }
.controls-panel { width:320px; background:#2a2a2a; padding:20px; border-radius:10px; max-height:80vh; overflow-y:auto; }

.svg-container { 
  display:flex; 
  justify-content:center; 
  align-items:center;
  min-height:400px;
  background:#1a1a1a;
  border-radius:8px;
  padding:20px;
}
.svg-container svg {
  max-width:100%;
  max-height:500px;
  image-rendering: pixelated;
}

.group { 
  background:#333; 
  padding:12px; 
  border-radius:8px; 
  margin-bottom:10px;
}
.group-header {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.color-preview {
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid #555;
}
.group-info { flex:1; }
.group-name { font-weight:bold; font-size:14px; }
.group-stats { font-size:11px; color:#888; }

input[type="color"] {
  width:100%;
  height:35px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

.url-input {
  width:100%;
  padding:10px;
  background:#333;
  border:1px solid #555;
  border-radius:6px;
  color:white;
  font-size:14px;
  margin-bottom:15px;
}
.load-btn {
  width:100%;
  padding:12px;
  background:#4a9eff;
  border:none;
  border-radius:6px;
  color:white;
  font-size:14px;
  cursor:pointer;
  font-weight:bold;
}
.load-btn:hover { background:#3a8eef; }

.status { text-align:center; padding:10px; color:#888; }
</style>
</head>
<body>

<h2>🎨 HSV Smart SVG Editor</h2>

<div class="container">
  <div class="svg-panel">
    <input type="text" id="svgUrl" class="url-input" placeholder="SVG URL giriniz..." value="https://transformiceadventures.com/tfmadv/equipement/33/chapeau1.svg">
    <button id="loadBtn" class="load-btn">SVG Yükle</button>
    <div id="svgContainer" class="svg-container"></div>
    <div id="status" class="status">SVG yüklenmedi</div>
  </div>
  
  <div class="controls-panel">
    <h3>🎯 Renk Grupları</h3>
    <div id="colorGroups"></div>
  </div>
</div>

<script>
// parse rgb + opacity
function parse(style){
  if(!style) return null;
  
  const rgb = style.match(/rgb\((\d+),(\d+),(\d+)\)/);
  const a = style.match(/fill-opacity:([\d.]+)/);
  if(!rgb) return null;

  return {
    r:+rgb[1],
    g:+rgb[2],
    b:+rgb[3],
    a:a ? +a[1] : 1
  };
}

// RGB → HSV
function rgbToHsv({r,g,b}){
  r/=255; g/=255; b/=255;

  let max = Math.max(r,g,b), min = Math.min(r,g,b);
  let d = max - min;

  let h = 0;
  if(d !== 0){
    if(max === r) h = (g-b)/d;
    else if(max === g) h = 2 + (b-r)/d;
    else h = 4 + (r-g)/d;
    h *= 60;
    if(h < 0) h += 360;
  }

  let s = max === 0 ? 0 : d/max;
  let v = max;

  return {h,s,v};
}

// HSV → RGB
function hsvToRgb(h,s,v){
  let c = v*s;
  let x = c*(1-Math.abs((h/60)%2-1));
  let m = v-c;

  let r=0,g=0,b=0;

  if(h<60){ r=c; g=x; }
  else if(h<120){ r=x; g=c; }
  else if(h<180){ g=c; b=x; }
  else if(h<240){ g=x; b=c; }
  else if(h<300){ r=x; b=c; }
  else { r=c; b=x; }

  return {
    r:Math.round((r+m)*255),
    g:Math.round((g+m)*255),
    b:Math.round((b+m)*255)
  };
}

// hue distance
function hueDist(a,b){
  let d = Math.abs(a-b);
  return Math.min(d, 360-d);
}

// load SVG
function loadSVG(url) {
  document.getElementById("status").textContent = "Yükleniyor...";
  document.getElementById("colorGroups").innerHTML = "";
  
  fetch(url)
  .then(r => {
    if(!r.ok) throw new Error("SVG bulunamadı");
    return r.text();
  })
  .then(svgText=>{
    document.getElementById("svgContainer").innerHTML = svgText;
    document.getElementById("status").textContent = "SVG yüklendi - Renkler analiz ediliyor...";
    
    analyzeSVG();
  })
  .catch(err=>{
    document.getElementById("status").textContent = "Hata: " + err.message;
  });
}

// analyze SVG and create color groups
function analyzeSVG() {
  const paths = [...document.querySelectorAll("path")];
  
  const pixels = paths.map(p=>{
    const c = parse(p.getAttribute("style") || p.getAttribute("fill"));
    if(!c) return null;

    const hsv = rgbToHsv(c);

    return {
      el:p,
      rgb:c,
      hsv:hsv
    };
  }).filter(Boolean);

  // classify pixels
  pixels.forEach(p=>{
    p.isOutline = p.hsv.v < 0.2 && p.hsv.s < 0.3;
    p.isNeutral = p.hsv.s < 0.15;
  });

  // group real colors
  const groups = [];

  pixels
    .filter(p => !p.isOutline && !p.isNeutral)
    .forEach(p=>{
      let found = false;

      for(let g of groups){
        if(
          hueDist(g.h, p.hsv.h) < 20 &&
          Math.abs(g.s - p.hsv.s) < 0.25
        ){
          g.items.push(p);
          found = true;
          break;
        }
      }

      if(!found){
        groups.push({
          h: p.hsv.h,
          s: p.hsv.s,
          items: [p]
        });
      }
    });

  // store base shading reference
  groups.forEach(g=>{
    g.baseV = Math.max(...g.items.map(p=>p.hsv.v));
    g.baseS = g.items.reduce((a,p)=>a+p.hsv.s,0) / g.items.length;
  });

  // create UI
  const controls = document.getElementById("colorGroups");
  
  if(groups.length === 0) {
    document.getElementById("status").textContent = "Renk grubu bulunamadı";
    return;
  }

  groups.forEach((g,i)=>{
    const div = document.createElement("div");
    div.className = "group";
    
    // get current color for preview
    const sampleRgb = hsvToRgb(g.h, g.s, g.baseV);
    const hexColor = "#" + 
      sampleRgb.r.toString(16).padStart(2,'0') +
      sampleRgb.g.toString(16).padStart(2,'0') +
      sampleRgb.b.toString(16).padStart(2,'0');

    div.innerHTML = `
      <div class="group-header">
        <div class="color-preview" style="background:${hexColor}"></div>
        <div class="group-info">
          <div class="group-name">Renk ${i+1}</div>
          <div class="group-stats">${g.items.length} element • H:${Math.round(g.h)}° S:${Math.round(g.s*100)}%</div>
        </div>
      </div>
      <input type="color" data-i="${i}" value="${hexColor}">
    `;

    controls.appendChild(div);
  });

  document.getElementById("status").textContent = `${groups.length} renk grubu bulundu`;

  // 🎨 recolor handler
  controls.addEventListener("input", e=>{
    const i = e.target.dataset.i;
    if(i === undefined) return;
    
    i = parseInt(i);
    const hex = e.target.value;

    let r = parseInt(hex.substr(1,2),16);
    let g = parseInt(hex.substr(3,2),16);
    let b = parseInt(hex.substr(5,2),16);

    let baseHSV = rgbToHsv({r,g,b});
    let group = groups[i];

    group.items.forEach(p=>{
      if(p.isOutline || p.isNeutral) return;

      // preserve real shading
      let deltaV = p.hsv.v - group.baseV;
      let newV = baseHSV.v + deltaV;

      // optional saturation preservation
      let newS = baseHSV.s * (p.hsv.s / group.baseS);

      // clamp
      newV = Math.max(0, Math.min(1, newV));
      newS = Math.max(0, Math.min(1, newS));

      let rgb = hsvToRgb(baseHSV.h, newS, newV);

      p.el.setAttribute("style", `
        fill:rgb(${rgb.r},${rgb.g},${rgb.b});
        fill-opacity:${p.rgb.a};
        stroke:none;
      `);
    });
    
    // update preview
    e.target.parentElement.querySelector(".color-preview").style.background = hex;
  });
}

// event listeners
document.getElementById("loadBtn").addEventListener("click", ()=>{
  const url = document.getElementById("svgUrl").value;
  if(url) loadSVG(url);
});

document.getElementById("svgUrl").addEventListener("keypress", e=>{
  if(e.key === "Enter") {
    const url = e.target.value;
    if(url) loadSVG(url);
  }
});

// auto load on page load
window.addEventListener("load", ()=>{
  const url = document.getElementById("svgUrl").value;
  if(url) loadSVG(url);
});
</script>

</body>
</html>

const dockDefaults = { library: 248, inspector: 310, timeline: 263, track: 185 };
function setupDockResize() {
    const app = $('.app');

        const key = { library: '--library-width', inspector: '--inspector-width', timeline: '--timeline-height', track: '--track-width' };
        app.style.setProperty(key[name], `${value}px`);
        try {
            localStorage.setItem('tde:dock:' + name, String(value));
        }
        catch { }
        renderRequested = true;
    };
    // Stored widths may have been chosen on a much wider screen. Keep the canvas
    // at least 440px wide when returning to a smaller desktop window.
    const stored = (name) => { try {
        return Number(localStorage.getItem('tde:dock:' + name)) || dockDefaults[name];
    }
    catch {
        return dockDefaults[name];
    } };
    const fitDesktopWidths = () => {
        if (window.innerWidth <= 1050)
            return;
        const allowed = Math.max(435, window.innerWidth - 440);
        const library = clamp(Number.parseFloat(app.style.getPropertyValue('--library-width')) || dockDefaults.library, 195, Math.min(600, allowed - 240));
        const inspector = clamp(Number.parseFloat(app.style.getPropertyValue('--inspector-width')) || dockDefaults.inspector, 240, Math.min(600, allowed - library));
        if (library !== Number.parseFloat(app.style.getPropertyValue('--library-width')))
            apply('library', library);
        if (inspector !== Number.parseFloat(app.style.getPropertyValue('--inspector-width')))
            apply('inspector', inspector);
    };
    for (const name of Object.keys(dockDefaults)) {
        const value = stored(name);
        apply(name, clamp(value, name === 'track' ? 125 : name === 'timeline' ? 155 : name === 'inspector' ? 240 : 195, name === 'timeline' ? 650 : name === 'track' ? 500 : 600));
    }
    fitDesktopWidths();
    window.addEventListener('resize', fitDesktopWidths);
    document.querySelectorAll('[data-resize]').forEach(handle => {
        handle.addEventListener('pointerdown', event => {
            if (event.button !== 0 || window.innerWidth <= 1050 && handle.dataset.resize !== 'timeline' && handle.dataset.resize !== 'track')

            const start = Number.parseFloat(getComputedStyle(app).getPropertyValue({ library: '--library-width', inspector: '--inspector-width', timeline: '--timeline-height', track: '--track-width' }[name])) || dockDefaults[name];
            const x = event.clientX, y = event.clientY;
